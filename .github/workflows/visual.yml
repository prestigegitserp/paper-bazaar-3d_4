name: visual-smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app
        run: npm install --no-audit --no-fund

      - name: Install capture runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 0.0.0.0 > /tmp/paper-bazaar-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/paper-bazaar-3d_4/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/paper-bazaar-preview.log
          exit 1

      - name: Capture visual states
        run: node scripts/capture.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: |
            visual-home.png
            visual-atlas.png
            visual-packlab.png
            visual-chroma.png
            visual-circula.png
            visual-walk.png
            visual-mobile.png
          if-no-files-found: error
